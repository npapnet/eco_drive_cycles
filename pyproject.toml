[project]
name = "drive-cycle-calculator"
version = "0.5.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "scipy>=1.17.1",
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "geopandas>=1.1.3",
    "plotnine>=0.15.3",
    "bokeh>=3.9.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]

[project.scripts]
dcc = "drive_cycle_calculator.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drive_cycle_calculator"]

[tool.hatch.build.targets.sdist]
exclude = ["students"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9",
    "jupyter>=1.1.1",
    "ipython>=9.12.0",
    "sphinx>=9.1.0",
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinxcontrib-mermaid>=2.0.2",
    "sphinx-autodoc-typehints>=3.10.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["students"]

[tool.ruff.lint]
select = ["E", "F", "I"]
